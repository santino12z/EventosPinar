<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de clientes - Eventos Pinar</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=8">
<script src="sesion.js?v=4"></script>
</head>
<body>
<header><h1><img src="img/logo.png" alt="" class="logo-portal" onerror="this.remove()">Eventos Pinar · Portal de clientes</h1><a href="../index.html">Volver al sitio</a></header>
<main>
  <div class="card" id="cardIngreso" style="max-width:460px;margin:0 auto;">
    <img src="img/logo.png" alt="Eventos Pinar" class="logo-ingreso" onerror="this.remove()">
    <p style="text-align:right;margin:0 0 8px;font-size:.85rem;"><a href="admin.html" style="color:var(--marca-texto);">Ingreso de administrador &rarr;</a></p>
    <div class="tabs">
      <button id="tabLogin" class="activo" type="button">Ingresar</button>
      <button id="tabRegistro" type="button">Registrarme</button>
    </div>

    <form id="formLogin">
      <label>Usuario (tu DNI)</label>
      <input name="dni" inputmode="numeric" required>
      <label>Contraseña (tu DNI)</label>
      <input name="password" inputmode="numeric" required>
      <small style="color:#777">Ingresá con tu DNI como usuario y como contraseña.</small>
      <button type="submit">Ingresar</button>
      <div class="msg" id="msgLogin"></div>
    </form>

    <form id="formRegistro" class="oculto">
      <label>Nombre completo</label>
      <input name="nombre" required>
      <label>DNI</label>
      <input name="dni" inputmode="numeric" required>
      <label>Mail</label>
      <input name="mail" type="email" required>
      <label>Teléfono de WhatsApp (con código de país)</label>
      <input name="telefono" inputmode="tel" placeholder="5491134334894" required>
      <small style="color:#777">Formato: 54 + código de área + número, sin 0 ni 15. Ej: 5491134334894</small>
      <small style="color:#777">Tu contraseña para ingresar es tu DNI.</small>
      <button type="submit">Crear cuenta</button>
      <div class="msg" id="msgRegistro"></div>
    </form>
  </div>
  <div id="panelCliente" class="oculto">
    <div style="text-align:right;margin-bottom:12px;"><button class="sec peq" id="btnSalir" type="button">Salir</button></div>
    <div class="card" id="bienvenida"><p>Cargando...</p></div>
    <div id="contenido"></div>
  </div>
</main>
<script src="documentos-visor.js?v=1"></script>
<script src="panel.js?v=8"></script>
<script src="ingreso.js?v=4"></script>
</body>
</html>
